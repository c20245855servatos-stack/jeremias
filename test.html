    <script>

        class SolarPanel {
            constructor(panelId, wattageOutput, sunlightHours) {
                this.panelId = panelId;
                this._wattageOutput = wattageOutput;
                this.sunlightHours = sunlightHours;
            }


            get wattageOutput() {
                return this._wattageOutput;
            }


            // Setter for wattageOutput
            set wattageOutput(value) {
                if (value <= 0) {
                    console.log("Error: Wattage must be greater than zero.");
                    return;
                }


                this._wattageOutput = value;
            }


            // Return panel details
            getDetails() {
                return `Panel: ${this.panelId} | Output: ${this.wattageOutput}W | Sun: ${this.sunlightHours}h`;
            }
        }


        class TrackingPanel extends SolarPanel {
            constructor(panelId, wattageOutput, sunlightHours, efficiencyBoostPercent) {
                super(panelId, wattageOutput, sunlightHours);
                this._efficiencyBoostPercent = efficiencyBoostPercent;
            }


            // Getter for efficiencyBoostPercent
            get efficiencyBoostPercent() {
                return this._efficiencyBoostPercent;
            }


            // Setter for efficiencyBoostPercent
            set efficiencyBoostPercent(value) {
                if (value < 0) {
                    console.log("Error: Efficiency boost cannot be negative.");
                    return;
                }


                this._efficiencyBoostPercent = value;
            }


            // Override getDetails()
            getDetails() {
                return `${super.getDetails()} | Boost: ${this.efficiencyBoostPercent}%`;
            }
        }

        function calculateDailyPowerOutput(panel, weatherCondition) {
            let baseline = panel.wattageOutput * panel.sunlightHours;


            // Apply efficiency boost if present
           


            // Weather adjustments
            if (weatherCondition == "Sunny") {
                finalOutput = baseline * 1.00;
            } 
            else if (weatherCondition == "Cloudy") {
                finalOutput = baseline * 0.60;
            } 
            else if (weatherCondition == "Rainy") {
                finalOutput = baseline * 0.20;
            } 
            else {
                console.log("Invalid weather condition");
                return 0;
            }


            return finalOutput.toFixed(2);
        }




   
        function auditSolarArray(panelArray) {
            let totalArrayPower = 0;


            // Standard for loop
            for (let i = 0; i < panelArray.length; i++) {
                const panel = panelArray[i];


                console.log(panel.getDetails());


                // Condition flag
                if (panel.sunlightHours < 2) {
                    console.log("[SHADED] Low solar exposure warning.");
                } 
                else if (panel.wattageOutput >= 400) {
                    console.log("[HIGH CAPACITY] Optimal generation panel.");
                } 
                else {
                    console.log("[OPERATIONAL] Normal energy flow.");
                }


                // Accumulate baseline power
                totalArrayPower += panel.wattageOutput * panel.sunlightHours;
            }


            return totalArrayPower;
        }

const staticPanel = new SolarPanel("PANEL-02", 300, 1);
